<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <title>CineTicket - Movie Ticket Booking System</title>
    
</head>
<body>

    <header>
        <h1>🎬 CineTicket</h1>
        <span>DBMS Microproject UI</span>
    </header>

    <div class="container">
        <!-- 1. Movies List Section -->
        <section id="movie-section">
            <h2>Now Showing</h2>
            <div class="movie-grid" id="movieGrid">
                <!-- Dynamically populated by JS -->
            </div>
        </section>

        <!-- 2. Booking & Seat Selection Section -->
        <section id="booking-section" class="booking-section">
            <h2 id="selectedMovieTitle">Book Tickets</h2>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <!-- Customer Details Form -->
                <div>
                    <h3>1. Customer Details</h3>
                    <br>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="custName" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="custPhone" placeholder="Enter phone number" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="custEmail" placeholder="Enter email" required>
                    </div>
                    <div class="form-group">
                        <label>Select Show Time</label>
                        <select id="showTimeSelect">
                            <option value="1">10:00 AM (Screen 1)</option>
                            <option value="2">02:30 PM (Screen 1)</option>
                            <option value="3">06:45 PM (Screen 2)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="paymentMethod">
                            <option value="UPI">UPI / Google Pay</option>
                            <option value="Card">Credit/Debit Card</option>
                            <option value="NetBanking">Net Banking</option>
                        </select>
                    </div>
                </div>

                <!-- Seat Selection Panel -->
                <div>
                    <h3>2. Select Seats</h3>
                    <div class="screen-container">
                        <div class="screen"></div>
                        <div class="screen-label">SCREEN THIS WAY</div>
                        <div class="seats-grid" id="seatsGrid">
                            <!-- Generated by JS -->
                        </div>
                        <div class="legend">
                            <div class="legend-item"><div class="legend-box" style="background: #444;"></div> Available</div>
                            <div class="legend-item"><div class="legend-box" style="background: var(--accent-green);"></div> Selected</div>
                            <div class="legend-item"><div class="legend-box" style="background: #222;"></div> Booked</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Booking Summary & Submit -->
            <div class="summary-box">
                <div class="summary-row">
                    <span>Selected Seats:</span>
                    <strong id="selectedSeatsText">None</strong>
                </div>
                <div class="summary-row">
                    <span>Ticket Price (per seat):</span>
                    <span>₹<span id="ticketPrice">200</span></span>
                </div>
                <hr style="border-color: #444; margin: 10px 0;">
                <div class="summary-row" style="font-size: 16px; color: var(--accent-green);">
                    <span>Total Amount:</span>
                    <strong>₹<span id="totalAmount">0</span></strong>
                </div>
            </div>

            <br>
            <button class="btn" onclick="confirmBooking()">Confirm & Pay</button>
            <button class="btn" onclick="cancelBooking()" style="background-color: #555; margin-top: 10px;">Cancel</button>
        </section>
    </div>

    
</body>
</html>
